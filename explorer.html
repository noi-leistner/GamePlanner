<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Explorer</title>
        <link rel="stylesheet" href="css/base.css">
        <link rel="stylesheet" href="css/layout.css">
        <link rel="stylesheet" href="css/explorer.css">

        <script src="js/nav.js" defer></script>
        <script src="js/config.js" defer></script>
        <script src="js/explorer.js" defer></script>
    </head>
    
    <body>
        <header>
            <nav>
                <a href="index.html" class="logo">GamePlanner+</a>
                <button class="menu-toggle" aria-label="Open menu" aria-expanded="false" aria-controls="nav-links">☰</button>
                <ul id="nav-links">
                    <li><a href="library.html">Library</a></li>
                    <li><a href="explorer.html">Explorer</a></li>
                    <li><a href="gameguide.html">GameGuide</a></li>
                    <li><a href="about.html">About</a></li>
                </ul>
            </nav>
        </header>

        <main>
            <h1>Game Explorer</h1>
            <form id="search-form" class="toolbar">
                <input type="search" id="search-input" placeholder="Search games..." aria-label="Search games">

                <select id="genre-filter" aria-label="Genre">
                    <option value="">All genres</option>
                </select>

                <select id="platform-filter" aria-label="Platform">
                    <option value="">All platforms</option>
                </select>

                <button type="submit" class="button">Search</button>
            </form>

            <section id="game-grid" class="auto-grid"></section>
            <button id="load-more" class="button" hidden>Load more</button>
            <p class="attribution">Game data from <a href="https://rawg.io" target="_blank">RAWG</a></p>
        </main>

        <footer>
            <p>If you have any issues, please contact the developer at developer@gmail.com</p>
        </footer>
    </body>
</html>
